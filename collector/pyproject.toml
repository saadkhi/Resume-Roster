[project]
name = "scrabeee"
version = "0.1.0"
description = "A multi-source technology job discovery and aggregation engine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".local", ".pythonlibs", ".cache", "attached_assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
