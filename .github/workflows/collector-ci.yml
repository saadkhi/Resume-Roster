name: Collector CI

on:
  push:
    paths:
      - "collector/**"
      - ".github/workflows/collector*.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (all source HTTP and JobSpy calls are mocked)
        run: pytest
