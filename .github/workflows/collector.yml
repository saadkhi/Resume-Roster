name: Twice-daily job collection

on:
  schedule:
    # 12:00 PM and 12:00 AM Asia/Karachi (UTC+05:00).
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: collector
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///jobs.db' }}
      SEARCH_QUERIES: ${{ vars.SEARCH_QUERIES }}
      SEARCH_LOCATIONS: ${{ vars.SEARCH_LOCATIONS }}
      JOBSPY_SITES: ${{ vars.JOBSPY_SITES || 'indeed,zip_recruiter' }}
      ENABLED_SOURCES: ${{ vars.ENABLED_SOURCES || 'remote_ok,we_work_remotely,hacker_news' }}
      JOB_MAX_AGE_HOURS: "72"
      OUTPUT_DIR: output
      LOG_LEVEL: INFO
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      - name: Require persistent PostgreSQL for scheduled runs
        if: github.event_name == 'schedule'
        env:
          SCHEDULE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          case "$SCHEDULE_DATABASE_URL" in
            postgres://*|postgresql://*|postgresql+psycopg2://*) ;;
            *)
              echo "::error::Configure a persistent PostgreSQL Actions secret named DATABASE_URL before scheduled collection."
              exit 1
              ;;
          esac

      - name: Collect jobs
        id: collect
        run: python main.py

      - name: Upload run logs and exports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-collection-${{ github.run_id }}
          path: |
            collector/output/
            collector/jobs.db
          if-no-files-found: warn
          retention-days: 30
